# Бесплатный проект Supabase засыпает после недели без запросов — и тогда в приложение
# не войти. Раз в два дня «заглядываем» в облако, чтобы оно не уснуло. Если облако уже
# спит, шаг упадёт и GitHub пришлёт письмо — значит, пора нажать Restore в Supabase.
name: Не дать облаку уснуть

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос к облаку
        run: >
          curl -fsS --retry 3 --max-time 30
          "https://orrdqcjqeprccpzicfmb.supabase.co/rest/v1/user_progress?select=user_id&limit=1"
          -H "apikey: sb_publishable_Bn7h4TJ6KYe8o60ySPSOTA_AbLz8SEB"
