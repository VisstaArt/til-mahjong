<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Финальный набор иконок — Тил Маджонг</title>
<style>
  body { background:#142622; color:#f1f5f2; font-family:-apple-system,sans-serif; padding:24px; }
  h1 { font-size:1.2rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px; }
  .card { background:#1b4332; border-radius:12px; padding:10px; text-align:center; }
  .card img, .card .swatch { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; background:#d8ecdf; }
  .card .swatch { display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:#fff; }
  .card div.label { margin-top:6px; font-size:0.85rem; color:#e9c46a; }
</style>
</head>
<body>
  <h1>Финальный набор — стиль E2 (kawaii + сценка)</h1>
  <div class="grid" id="grid"></div>
  <script>
    const words = [
      ["kitap","kitap"], ["çay","cay"], ["ekmek","ekmek"], ["su","su"], ["ev","ev"],
      ["araba","araba"], ["kedi","kedi"], ["köpek","kopek"], ["güneş","gunes"], ["ay","ay"],
      ["koşmak","kosmak"], ["yüzmek","yuzmek"], ["okumak","okumak"], ["yazmak","yazmak"],
      ["uyumak","uyumak"], ["yürümek","yurumek"], ["büyük","buyuk"], ["küçük","kucuk"],
    ];
    const colors = [["kırmızı","#e63946"], ["mavi","#2a6fdb"]];
    const grid = document.getElementById("grid");
    words.forEach(([label, file]) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<img src="assets/icons/${file}.png"><div class="label">${label}</div>`;
      grid.appendChild(card);
    });
    colors.forEach(([label, hex]) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `<div class="swatch" style="background:${hex}"></div><div class="label">${label} (заливка)</div>`;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
